<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movance Policies</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --border: #e2e2e2;
    --accent: #0a6e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --fg: #f0f0f0;
      --muted: #a8adb2;
      --border: #2c3136;
      --accent: #4fd6b8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Roboto, sans-serif;
    line-height: 1.7;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }
  li a {
    display: block;
    padding: 0.9rem 1.1rem;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  li a:hover { color: var(--accent); }
  li span {
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.2rem;
  }
  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Movance — Published Policies</h1>
  <ul>
    <li>
      <a href="sizepass/privacy-policy.html">SizePass — プライバシーポリシー
      <span>Privacy Policy for the SizePass Android app</span></a>
    </li>
  </ul>
  <footer>
    <p>&copy; 2026 Movance</p>
  </footer>
</main>
</body>
</html>
